# ============================================================
# 🧹 LIMPEZA INTELIGENTE DE WORKFLOWS
# ============================================================

name: 🧹 Limpeza Inteligente de Workflows (1h)

# ============================================================
# ⏰ AGENDAMENTO
# ============================================================

on:

  # A cada 8 horas
  schedule:
    - cron: "1 */8 * * *"

  # Execução manual
  workflow_dispatch:

# ============================================================
# 🔐 PERMISSÕES
# ============================================================

permissions:
  actions: write

# ============================================================
# 🧹 JOB
# ============================================================

jobs:

  cleanup:

    name: 🧹 Limpar Execuções Antigas

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # ======================================================
      # 🧹 LIMPEZA
      # ======================================================

      - name: 🗑️ Limpar execuções antigas
        id: cleanup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        shell: bash

        run: |

          set -Eeuo pipefail

          # ==================================================
          # ⚙️ CONFIGURAÇÕES
          # ==================================================

          RETENTION_SECONDS=3600
          PER_PAGE=100
          MAX_RETRIES=3

          NOW=$(date -u +%s)

          TEMP_DIR="$(mktemp -d)"

          trap 'rm -rf "$TEMP_DIR"' EXIT

          PAGES_FILE="$TEMP_DIR/pages.json"
          RUNS_FILE="$TEMP_DIR/runs.jsonl"
          DELETE_FILE="$TEMP_DIR/delete.txt"
          SUCCESS_FILE="$TEMP_DIR/success.txt"
          FAILED_FILE="$TEMP_DIR/failed.txt"

          touch \
            "$RUNS_FILE" \
            "$DELETE_FILE" \
            "$SUCCESS_FILE" \
            "$FAILED_FILE"

          # ==================================================
          # 🎨 CABEÇALHO
          # ==================================================

          echo ""
          echo "╔══════════════════════════════════════════════════════╗"
          echo "║        🧹 LIMPEZA INTELIGENTE DE WORKFLOWS         ║"
          echo "╠══════════════════════════════════════════════════════╣"
          echo "║ ⏱️  Retenção: 1 hora                                 ║"
          echo "║ 🔄 Frequência: a cada 8 horas                        ║"
          echo "║ 🛡️  Execuções em andamento: preservadas             ║"
          echo "║ 🔁 Retry automático: 3 tentativas                    ║"
          echo "╚══════════════════════════════════════════════════════╝"
          echo ""

          echo "📦 Repositório : $GITHUB_REPOSITORY"
          echo "🕒 UTC         : $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "🕒 Local       : $(date '+%Y-%m-%d %H:%M:%S')"
          echo ""

          # ==================================================
          # 🔎 FASE 1
          # ==================================================

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔎 FASE 1/3 — CONSULTANDO EXECUÇÕES"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # --------------------------------------------------
          # 📥 Consulta todas as páginas
          # --------------------------------------------------

          if ! gh api \
            --paginate \
            --slurp \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=${PER_PAGE}" \
            > "$PAGES_FILE"; then

            echo ""
            echo "❌ ERRO: Não foi possível consultar a API do GitHub."
            exit 1

          fi

          # --------------------------------------------------
          # 🔧 CORREÇÃO IMPORTANTE
          #
          # --slurp retorna:
          #
          # [
          #   {
          #     "total_count": ...,
          #     "workflow_runs": [...]
          #   }
          # ]
          #
          # Portanto devemos acessar:
          #
          # .[] | .workflow_runs[]
          #
          # e NÃO:
          #
          # .[][]
          # --------------------------------------------------

          jq -c '
            .[]
            | .workflow_runs[]
          ' "$PAGES_FILE" > "$RUNS_FILE"

          TOTAL_FOUND=$(wc -l < "$RUNS_FILE" | tr -d ' ')

          echo ""
          echo "📦 Total de execuções encontradas: $TOTAL_FOUND"

          # ==================================================
          # 📊 CONTADORES
          # ==================================================

          TOTAL_OLD=0
          TOTAL_NEW=0
          TOTAL_RUNNING=0
          TOTAL_COMPLETED=0
          TOTAL_CANCELLED=0
          TOTAL_FAILURE=0

          # ==================================================
          # 🔎 ANALISAR EXECUÇÕES
          # ==================================================

          while IFS= read -r RUN; do

            ID=$(jq -r '.id // empty' <<< "$RUN")
            CREATED=$(jq -r '.created_at // empty' <<< "$RUN")
            STATUS=$(jq -r '.status // empty' <<< "$RUN")
            CONCLUSION=$(jq -r '.conclusion // empty' <<< "$RUN")
            NAME=$(jq -r '.name // "Workflow desconhecido"' <<< "$RUN")

            # ------------------------------------------------
            # 🛡️ Validação
            # ------------------------------------------------

            if [ -z "$ID" ] || [ -z "$CREATED" ]; then
              continue
            fi

            # ------------------------------------------------
            # 🕒 Converter data
            # ------------------------------------------------

            RUN_DATE=$(date -u -d "$CREATED" +%s 2>/dev/null || true)

            if [ -z "$RUN_DATE" ]; then

              echo "⚠️ Data inválida:"
              echo "   ID: $ID"
              echo "   Data: $CREATED"

              continue

            fi

            AGE=$((NOW - RUN_DATE))

            AGE_HOURS=$((AGE / 3600))

            # ==================================================
            # 🛡️ EXECUÇÕES NÃO CONCLUÍDAS
            # ==================================================

            if [ "$STATUS" != "completed" ]; then

              TOTAL_RUNNING=$((TOTAL_RUNNING + 1))

              echo "🛡️ PRESERVADA"
              echo "   ID      : $ID"
              echo "   Workflow: $NAME"
              echo "   Status  : $STATUS"
              echo ""

              continue

            fi

            # ==================================================
            # 📊 ESTATÍSTICAS
            # ==================================================

            TOTAL_COMPLETED=$((TOTAL_COMPLETED + 1))

            if [ "$CONCLUSION" = "cancelled" ]; then
              TOTAL_CANCELLED=$((TOTAL_CANCELLED + 1))
            fi

            if [ "$CONCLUSION" = "failure" ]; then
              TOTAL_FAILURE=$((TOTAL_FAILURE + 1))
            fi

            # ==================================================
            # ⏱️ VERIFICAR IDADE
            # ==================================================

            if [ "$AGE" -ge "$RETENTION_SECONDS" ]; then

              TOTAL_OLD=$((TOTAL_OLD + 1))

              echo "$ID" >> "$DELETE_FILE"

              echo "🗑️ SELECIONADA"
              echo "   ID      : $ID"
              echo "   Workflow: $NAME"
              echo "   Idade   : ${AGE_HOURS}h"
              echo "   Resultado: ${CONCLUSION:-unknown}"
              echo ""

            else

              TOTAL_NEW=$((TOTAL_NEW + 1))

              echo "✅ PRESERVADA"
              echo "   ID      : $ID"
              echo "   Workflow: $NAME"
              echo "   Idade   : ${AGE_HOURS}h"
              echo ""

            fi

          done < "$RUNS_FILE"

          # ==================================================
          # 📊 RESUMO DA ANÁLISE
          # ==================================================

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 RESUMO DA ANÁLISE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "📦 Encontradas       : $TOTAL_FOUND"
          echo "🗑️ Antigas           : $TOTAL_OLD"
          echo "🕒 Recentes          : $TOTAL_NEW"
          echo "🛡️ Em andamento      : $TOTAL_RUNNING"
          echo "✅ Concluídas        : $TOTAL_COMPLETED"
          echo "🚫 Canceladas        : $TOTAL_CANCELLED"
          echo "❌ Falhas            : $TOTAL_FAILURE"

          # ==================================================
          # 🚪 NADA PARA EXCLUIR
          # ==================================================

          if [ "$TOTAL_OLD" -eq 0 ]; then

            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "✨ NENHUMA EXECUÇÃO ANTIGA"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""
            echo "🎉 O repositório já está limpo!"
            echo ""

            {
              echo "cleanup_count=0"
              echo "failed_count=0"
              echo "total_found=$TOTAL_FOUND"
              echo "total_old=0"
              echo "total_new=$TOTAL_NEW"
              echo "total_running=$TOTAL_RUNNING"
              echo "total_completed=$TOTAL_COMPLETED"
              echo "total_cancelled=$TOTAL_CANCELLED"
              echo "total_failure=$TOTAL_FAILURE"
              echo "success_rate=100.00"
            } >> "$GITHUB_OUTPUT"

            exit 0

          fi

          # ==================================================
          # 🗑️ FASE 2
          # ==================================================

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🗑️ FASE 2/3 — EXCLUSÃO"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "🎯 Execuções para excluir: $TOTAL_OLD"
          echo ""

          # ==================================================
          # 🗑️ FUNÇÃO DE EXCLUSÃO
          # ==================================================

          delete_run() {

            local RUN_ID="$1"
            local ATTEMPT=1

            while [ "$ATTEMPT" -le "$MAX_RETRIES" ]; do

              echo "🤖 Excluindo ID $RUN_ID — tentativa $ATTEMPT/$MAX_RETRIES"

              if gh api \
                --method DELETE \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
                >/dev/null 2>&1; then

                echo "$RUN_ID" >> "$SUCCESS_FILE"

                echo "   ✅ Sucesso"

                return 0

              fi

              echo "   ⚠️ Falha"

              if [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; then
                sleep $((ATTEMPT * 2))
              fi

              ATTEMPT=$((ATTEMPT + 1))

            done

            echo "$RUN_ID" >> "$FAILED_FILE"

            echo "   ❌ Falha definitiva"

            return 0
          }

          # ==================================================
          # 🚀 EXCLUSÃO CONTROLADA
          # ==================================================

          while IFS= read -r RUN_ID; do

            [ -z "$RUN_ID" ] && continue

            delete_run "$RUN_ID"

          done < "$DELETE_FILE"

          # ==================================================
          # 📊 FASE 3
          # ==================================================

          DELETED=$(wc -l < "$SUCCESS_FILE" | tr -d ' ')
          FAILED=$(wc -l < "$FAILED_FILE" | tr -d ' ')

          # ==================================================
          # 📈 TAXA DE SUCESSO
          # ==================================================

          if [ "$TOTAL_OLD" -gt 0 ]; then

            SUCCESS_RATE=$(
              awk \
                -v success="$DELETED" \
                -v total="$TOTAL_OLD" \
                'BEGIN {
                  printf "%.2f", (success / total) * 100
                }'
            )

          else

            SUCCESS_RATE="100.00"

          fi

          # ==================================================
          # 🏁 RESULTADO
          # ==================================================

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🏁 FASE 3/3 — LIMPEZA CONCLUÍDA"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          echo ""
          echo "📦 Encontradas       : $TOTAL_FOUND"
          echo "🗑️ Selecionadas      : $TOTAL_OLD"
          echo "✅ Deletadas         : $DELETED"
          echo "❌ Falharam          : $FAILED"
          echo "🕒 Recentes          : $TOTAL_NEW"
          echo "🛡️ Em andamento      : $TOTAL_RUNNING"
          echo "📈 Taxa de sucesso   : ${SUCCESS_RATE}%"
          echo ""

          if [ "$FAILED" -eq 0 ]; then

            echo "🎉 TODAS AS EXECUÇÕES ANTIGAS FORAM REMOVIDAS!"

          else

            echo "⚠️ Algumas execuções não puderam ser removidas."

          fi

          echo ""

          # ==================================================
          # 📤 OUTPUTS
          # ==================================================

          {
            echo "cleanup_count=$DELETED"
            echo "failed_count=$FAILED"
            echo "total_found=$TOTAL_FOUND"
            echo "total_old=$TOTAL_OLD"
            echo "total_new=$TOTAL_NEW"
            echo "total_running=$TOTAL_RUNNING"
            echo "total_completed=$TOTAL_COMPLETED"
            echo "total_cancelled=$TOTAL_CANCELLED"
            echo "total_failure=$TOTAL_FAILURE"
            echo "success_rate=$SUCCESS_RATE"
          } >> "$GITHUB_OUTPUT"

      # ======================================================
      # 📋 RESUMO VISUAL
      # ======================================================

      - name: 📋 Gerar resumo
        if: always()
        shell: bash
        run: |

          set -u

          echo "# 🧹 Limpeza Inteligente de Workflows" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "> ⏱️ Retenção configurada: **1 hora**" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## 📊 Resultado" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Métrica | Resultado |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|" >> "$GITHUB_STEP_SUMMARY"

          echo "| 📦 Execuções encontradas | ${{ steps.cleanup.outputs.total_found || '0' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🗑️ Execuções antigas | ${{ steps.cleanup.outputs.total_old || '0' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ✅ Deletadas | ${{ steps.cleanup.outputs.cleanup_count || '0' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ❌ Falhas | ${{ steps.cleanup.outputs.failed_count || '0' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🕒 Recentes | ${{ steps.cleanup.outputs.total_new || '0' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🛡️ Em andamento | ${{ steps.cleanup.outputs.total_running || '0' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 📈 Taxa de sucesso | ${{ steps.cleanup.outputs.success_rate || '0' }}% |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## ⚙️ Configuração" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "- 🤖 Automático: a cada **8 horas**" >> "$GITHUB_STEP_SUMMARY"
          echo "- ⏱️ Retenção: **1 hora**" >> "$GITHUB_STEP_SUMMARY"
          echo "- 🔄 Retry: **3 tentativas**" >> "$GITHUB_STEP_SUMMARY"
          echo "- 🛡️ Execuções em andamento: **preservadas**" >> "$GITHUB_STEP_SUMMARY"
          echo "- 🔐 Permissão: **actions: write**" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━" >> "$GITHUB_STEP_SUMMARY"

          echo "🤖 Limpeza automática finalizada." >> "$GITHUB_STEP_SUMMARY"
